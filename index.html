<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- 저장된 테마를 첫 페인트 전에 적용 — 내용을 바꾸면 worker/index.ts 의 THEME_SCRIPT_HASH 도 갱신 (tests 가 검사) -->
    <script>try{var t=localStorage.getItem('efface-ds-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <title>efface design system</title>
    <meta name="description" content="efface 디자인 시스템 — efface.dev · v2.efface.dev · mom.efface.dev 에서 추출한 토큰, 컴포넌트, 모션." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- JetBrains Mono 는 모든 페이지 첫 화면(라벨)에 쓰인다 — CSS 파싱을 기다리지 않게 미리 받는다.
         Space Grotesk · Archivo Black 은 필요한 컴포넌트에서 지연 로드 (src/lib/fonts.ts) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/jetbrainsmono/v18/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxTOlOV.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
