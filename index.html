<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- 저장된 테마를 첫 페인트 전에 적용 — 내용을 바꾸면 worker/index.ts 의 THEME_SCRIPT_HASH 도 갱신 (tests 가 검사) -->
    <script>try{var t=localStorage.getItem('efface-ds-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <title>efface design system</title>
    <meta name="description" content="efface 디자인 시스템 — efface.dev · v2.efface.dev · mom.efface.dev 에서 추출한 토큰, 컴포넌트, 모션." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk: v2 푸터 워드마크(캔버스) · Archivo Black: v2 앱 카드 배경 워드 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
