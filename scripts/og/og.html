<!doctype html>
<!-- OG 이미지 원본 (1200×630). 만들기: npm run og  (Chrome headless 스크린샷 → public/og.png) -->
<html lang="ko"><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;background:#0a0a0b;color:#f6f6f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;overflow:hidden}
  .wrap{position:relative;width:1200px;height:630px;padding:72px 84px;box-sizing:border-box}
  .glow{position:absolute;right:-120px;top:-160px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,#3b62e5 0%,rgba(59,98,229,.35) 35%,transparent 70%);filter:blur(40px);opacity:.75}
  .mark{position:absolute;right:104px;top:150px;width:260px;height:260px}
  .mark i{position:absolute;width:150px;height:150px;border-radius:40px;display:block}
  .mark .a{left:0;top:0;background:#f2f2f5}
  .mark .b{left:110px;top:110px;background:#3b62e5}
  .label{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#7d7d87}
  .label b{color:#3b62e5;font-weight:400}
  h1{margin:28px 0 0;font-size:88px;line-height:1.02;letter-spacing:-.03em;font-weight:700}
  p{margin:28px 0 0;max-width:640px;font-size:28px;line-height:1.4;color:#a3a3ad}
  .foot{position:absolute;left:84px;bottom:64px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:20px;color:#7d7d87}
</style></head><body><div class="wrap">
  <div class="glow"></div>
  <div class="mark"><i class="a"></i><i class="b"></i></div>
  <div class="label"><b>//</b> efface</div>
  <h1>efface<br>design system</h1>
  <p>Tokens · Components · Motion — efface 제품들이 함께 쓰는 한 벌의 언어</p>
  <div class="foot">component.efface.dev</div>
</div></body></html>
